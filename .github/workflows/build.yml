name: Сборка каталога

on:
  push:
    paths:
      - 'data/**'
      - 'overrides.json'
      - 'config.json'
      - 'build_catalog.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Проверить, что таблица очищена
        run: python3 check_ods.py data/catalog.ods

      - name: Установить uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Собрать каталог
        run: uv run build_catalog.py data/catalog.ods --strict

      - name: Показать отчёт
        if: always()
        run: head -40 report.txt

      - name: Открыть Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: catalog/update
          title: Обновление каталога кружков
          commit-message: Пересборка courses.json
          body: |
            Автоматическая пересборка из таблицы.

            Проверьте дифф `courses.json` перед вливанием:
            резкое изменение количества, массовое изменение цен,
            исчезнувшие коды mos.ru, новые направленности.

            Замечания к исходной таблице — в `report.txt`.
          add-paths: |
            courses.json
            report.txt
